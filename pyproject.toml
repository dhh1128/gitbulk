[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX license metadata
build-backend = "setuptools.build_meta"

[project]
name = "gitbulk"
version = "0.5.0"
description = "Nightly PR triage and fleet maintenance across many GitHub repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Hardman", email = "daniel@provenant.net" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
gitbulk = "gitbulk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitbulk = ["manual-install-instructions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
