[project]
site_name = "gitbulk"
site_url = "https://dhh1128.github.io/gitbulk/"
site_description = "Nightly PR triage and fleet maintenance across many GitHub repositories — safe to run from cron alongside your local work."
site_author = "Daniel Hardman"
copyright = "Copyright &copy; 2026 Daniel Hardman — Apache-2.0"

docs_dir = "docs"
site_dir = "site"

repo_url = "https://github.com/dhh1128/gitbulk"
repo_name = "dhh1128/gitbulk"

# Explicit navigation. The user-facing guide comes first; the Development
# section surfaces the repo's internal design docs (kept in docs/ but written
# for contributors) and links the developer README on GitHub.
nav = [
    { Home = "index.md" },
    { Install = "install.md" },
    { Configuration = "configuration.md" },
    { Commands = "commands.md" },
    { "Running unattended" = "running-unattended.md" },
    { Reference = "reference.md" },
    { Development = [
        { Methodology = "methodology.md" },
        { Architecture = "architecture.md" },
        { "Design notes" = "design-notes.md" },
        { "Contributing (README)" = "https://github.com/dhh1128/gitbulk#readme" },
    ] },
]

[project.theme]
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.top",
    "navigation.footer",
    "content.code.copy",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown extensions (the standard MkDocs/Material set).
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
