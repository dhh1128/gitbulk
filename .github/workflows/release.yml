name: Release

# Tag-triggered release pipeline (this.i node reldst7q). scripts/release.py
# bumps + tags; this workflow builds the single-file zipapp and update.json
# and publishes both as release assets. Third-party actions are pinned by
# full commit SHA (node24-runtime versions; resolved 2026-06-03), matching
# ci.yml — a mutable tag like @v6 can be silently retargeted to malicious
# code, and this job has contents:write + publishes the binary every user
# downloads (supply-chain T4). Dependabot bumps the SHAs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Release authenticates via `gh` with an explicit GH_TOKEN, not the
          # checkout-persisted git creds, so don't bake the token into
          # .git/config where every later step could read it.
          persist-credentials: false

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install package from lockfile
        run: uv sync --frozen --extra test

      # Re-run the hermetic 100%-branch-coverage gate before building the
      # published artifact: scripts/release.py runs it locally pre-tag, but the
      # tag-triggered publish job must independently prove the binary it ships
      # passed its tests (OPS-F1). Mirrors ci.yml's gate on Python 3.12 only;
      # 3.10 compat is covered by ci.yml's matrix on the merge that produced
      # the tag, so gating the build on the 3.12 hermetic run is sufficient.
      - name: Run tests with branch coverage gate
        run: |
          uv run --python 3.12 pytest -v \
            -m "not e2e" \
            --cov=src/gitbulk \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100

      - name: Check tagged version matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'from importlib.metadata import version; print(version("gitbulk"))')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package version $pkg" >&2
            exit 1
          fi

      - name: Build release assets (zipapp + update.json)
        run: uv run python scripts/build_release_assets.py "${GITHUB_REF_NAME#v}" dist --repo "$GITHUB_REPOSITORY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/gitbulk \
            dist/update.json \
            --generate-notes
