name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Single-version per this.i node cipym4kr (revised 2026-05-28 after
    # CI exposed flaky tests across the matrix). Track the deployment
    # version in .python-version; bump both together.
    name: pytest (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package from lockfile
        run: uv sync --frozen --extra test

      - name: Run tests with branch coverage gate
        run: |
          uv run pytest -v \
            --cov=src/gitbulk \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
