name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Test on the advertised floor (3.10) AND the dev version (3.12); the 100%
  # branch-coverage gate runs on both. See this.i node cidvp4kr.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package from lockfile
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Run tests with branch coverage gate
        run: |
          uv run --python ${{ matrix.python-version }} pytest -v \
            -m "not e2e" \
            --cov=src/gitbulk \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100

  # Real-binary integration: exercise the bubblewrap sandbox + isolated-clone
  # workspace with real git/bwrap (no network — a local bare repo is the
  # origin). Separate from `test` so its environment-specific skips/failures
  # never block the hermetic 100%-coverage gate (this.i agtste9k).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install bubblewrap + enable unprivileged user namespaces
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged userns via AppArmor; relax it so
          # bwrap can run. Best-effort: the e2e tests skip themselves if the
          # probe still fails, so this never hard-fails the job on a locked-down
          # runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          if bwrap --ro-bind / / -- true; then
            echo "bwrap OK"
          else
            echo "bwrap unavailable; e2e tests will skip"
          fi

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install package from lockfile
        run: uv sync --frozen --extra test

      - name: Run e2e (real git + bwrap) integration tests
        run: uv run pytest -v -m e2e

  # Exercise the release-asset construction (shared with release.yml) on every
  # push/PR, without publishing — so the release path is validated pre-tag.
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install package from lockfile
        run: uv sync --frozen --extra test

      - name: Build release assets (no publish)
        run: uv run python scripts/build_release_assets.py "0.0.0+ci" dist --repo "${GITHUB_REPOSITORY:-dhh1128/gitbulk}"

      - name: Validate the assets
        run: |
          set -euo pipefail
          test -f dist/gitbulk
          test -f dist/update.json
          # The zipapp boots and reports the baked version.
          ./dist/gitbulk --version | grep -qF "0.0.0+ci"
          # update.json's sha256 matches the built binary.
          want="$(python -c "import json; print(json.load(open('dist/update.json'))['sha256'])")"
          got="$(sha256sum dist/gitbulk | awk '{print $1}')"
          if [ "$want" != "$got" ]; then
            echo "update.json sha256 ($want) != binary sha256 ($got)" >&2
            exit 1
          fi

  # Reject invisible / Trojan-Source Unicode (zero-width, bidi-control,
  # PUA, variation-selector, tag chars) in shipped source and prompts.
  # This is the GlassWorm / Trojan-Source defense: such payloads cannot be
  # caught by eye or ordinary linting. Gate lives in scripts/check_unicode.py
  # (stdlib-only, so no install step). See docs/threat-model.md (T2).
  unicode-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Reject invisible / Trojan-Source Unicode
        run: python3 scripts/check_unicode.py

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          # Pin the download by content hash so a retargeted/republished asset
          # can't slip a different binary into CI (supply-chain T4).
          echo "${sha256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

  # Secret-scanning gate (SEC-F2). A committed credential is permanently
  # compromised once it lands in git history, so block it at the door. Run
  # gitleaks over the checked-out tree; any finding fails the build.
  #
  # The binary is fetched as a pinned release and verified by content hash —
  # same download-and-checksum-and-run pattern as the actionlint job above —
  # rather than a marketplace action, so a retargeted/republished asset can't
  # slip a different binary into CI (supply-chain T4). Dependabot does not
  # bump this curl, so the version/sha256 are updated by hand on upgrade; the
  # authentic sha256 comes from the release's gitleaks_<ver>_checksums.txt.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Don't bake GITHUB_TOKEN into .git/config; this job never pushes.
          persist-credentials: false

      - name: Run gitleaks (secret scan)
        run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${sha256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          # `dir` scans the working tree; default --exit-code 1 fails the
          # build on any finding. --redact keeps any matched secret out of
          # the public CI log.
          /tmp/gitleaks dir . --no-banner --redact --exit-code 1
